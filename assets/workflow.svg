<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img" aria-labelledby="t d"><title id="t">How I build: idea, prompt, generate, review, ship</title><desc id="d">A five-step loop. Review feeds back into Prompt as fix and refine. Purple steps are done by me, cyan by AI.</desc>
