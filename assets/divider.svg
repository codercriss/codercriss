<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 14" width="760" height="14" role="img" aria-labelledby="t d"><title id="t">Divider</title><desc id="d">A thin gradient line with a light that sweeps across it.</desc>
<defs>
  <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#6C63FF" stop-opacity="0"/><stop offset=".22" stop-color="#6C63FF" stop-opacity=".7"/><stop offset=".78" stop-color="#00D4FF" stop-opacity=".7"/><stop offset="1" stop-color="#00D4FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0" y="6" width="760" height="2" rx="1" fill="url(#l)"/>
